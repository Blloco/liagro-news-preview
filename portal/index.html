      { title: "Embrapa apresenta balanço de pesquisas em pecuária", source: "Embrapa", published_at: "2026-07-13", sentiment: "pos", url: "#", keywords: [] },
      { title: "Exportação de frutas do Vale do São Francisco cresce no semestre", source: "Canal Rural", published_at: "2026-07-16", sentiment: "pos", url: "#", keywords: ["Nordeste", "uva"] },
      { title: "Colheita de café avança em São Paulo, no Sudeste", source: "Cultivar", published_at: "2026-07-17", sentiment: "pos", url: "#", keywords: ["café", "Sudeste", "São Paulo"] }
    ]
  }
];

// Full keyword taxonomy — mirrors the real "keywords" table (migrations
// 009/010/015/016). Powers the "Palavras-chave" browse page; clicking any
// term filters MOCK_BULLETINS' highlights/articles for that exact tag.
const MOCK_ALL_KEYWORDS = {
  cultura: [
    "soja", "milho", "algodão", "café", "cana-de-açúcar", "trigo", "arroz", "feijão",
    "sorgo", "girassol", "amendoim", "mandioca", "cevada", "aveia", "gergelim",
    "mamona", "cacau", "uva", "citros", "maçã", "tomate", "batata", "fumo"
  ],
  insumo: ["herbicidas", "fungicidas", "inseticidas", "nematicidas", "fertilizantes", "biofertilizantes", "biodefensivos", "bioinsumos", "sementes"],
  regional: [
    "Cerrado", "Sul", "Sudeste", "Nordeste", "Norte",
    "Acre", "Alagoas", "Amapá", "Amazonas", "Bahia", "Ceará", "Distrito Federal",
    "Espírito Santo", "Goiás", "Maranhão", "Mato Grosso", "Mato Grosso do Sul",
    "Minas Gerais", "Pará", "Paraíba", "Paraná", "Pernambuco", "Piauí",
    "Rio de Janeiro", "Rio Grande do Norte", "Rio Grande do Sul", "Rondônia",
    "Roraima", "Santa Catarina", "São Paulo", "Sergipe", "Tocantins"
  ],
  empresa: [
    "Bayer", "BASF", "Corteva", "FMC", "Syngenta", "Ruveon",
    "Yara", "Mosaic", "ICL", "Heringer",
    "UPL", "Nufarm", "Adama", "Ihara", "TMG",
    "Cargill", "Bunge", "ADM", "Louis Dreyfus", "Amaggi", "COFCO",
    "JBS", "Marfrig", "BRF", "Minerva",
    "John Deere", "Case IH", "New Holland", "AGCO", "Jacto", "Stara",
    "Raízen", "Cosan"
  ],
  geral: ["clima"]
};
const KEYWORD_CATEGORY_LABELS = {
  cultura: "Culturas", insumo: "Insumos", regional: "Regiões e estados",
  empresa: "Empresas", geral: "Geral"
};
// The DB's "regional" category (migrations 009/010/016) mixes the 5 macro-
// regions with the 27 states/DF under one CHECK-constraint value. The
// keywords index page splits them visually into two sections; this set is
// just what distinguishes a macro-region term from a state term.
const MACRO_REGIONS = new Set(["Cerrado", "Sul", "Sudeste", "Nordeste", "Norte"]);

const WEEKDAY_FMT = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit" });
const FULL_FMT = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

function parseLocalDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function weekRangeLabel(b) {
  const s = parseLocalDate(b.week_start), e = parseLocalDate(b.week_end);
  return `${WEEKDAY_FMT.format(s)} a ${WEEKDAY_FMT.format(e)} de ${e.getFullYear()}`;
}
function publishedLabel(iso) {
  return FULL_FMT.format(new Date(iso));
}
function sentimentChips(s) {
  const parts = [];
  if (s.pos) parts.push(`<span class="sent-chip pos">+${s.pos} positivas</span>`);
  if (s.neg) parts.push(`<span class="sent-chip neg">−${s.neg} negativas</span>`);
  if (s.neu) parts.push(`<span class="sent-chip neu">${s.neu} neutras</span>`);
  return parts.join("");
}
function sentDotClass(s) { return s === "pos" ? "pos" : s === "neg" ? "neg" : "neu"; }
function sentLabel(s) { return s === "pos" ? "positiva" : s === "neg" ? "negativa" : "neutra"; }
function keywordHref(term) { return `#/palavra-chave/${encodeURIComponent(term)}`; }
// Keyword tags matched by the system (see migrations 009/010/015/016) — only
// rendered when an article actually matched at least one term, same as the
// real word-boundary matching in scraper/runner.py. Each tag links to the
// keyword's filtered page (see renderKeywordDetail).
function kwRow(keywords) {
  if (!keywords || !keywords.length) return "";
  return `<div class="kw-row">${keywords.map(k => `<a class="kw-chip" href="${keywordHref(k)}">${escapeHtml(k)}</a>`).join("")}</div>`;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Trending keywords — frequency of each matched keyword across every
// article/destaque in the given bulletins (default: all published
// bulletins, i.e. "trending lately" rather than just within one edition,
// since most terms only appear once inside any single week's mock data).
function computeTrending(bulletins, limit) {
  const counts = {};
  bulletins.forEach(b => {
    [...b.highlights, ...b.articles].forEach(item => {
      (item.keywords || []).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
    });
  });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, limit || 8);
}
function trendingCard(bulletins) {
  const trending = computeTrending(bulletins, 8);
  if (!trending.length) return "";
  const chips = trending.map(([term, count]) => `
    <a class="trend-chip" href="${keywordHref(term)}">${escapeHtml(term)}<span class="trend-count">${count}</span></a>`).join("");
  return `
    <div class="trending-card">
      <div class="eyebrow">Palavras-chave em alta</div>
      <div class="trend-row">${chips}</div>
    </div>`;
}

// Renders the full bulletin content (eyebrow/título/meta/lead/destaques/
// análise/artigos) as a single <article>. Reused both on the boletim's own
// detail page and embedded inline for the most recent edition on the home
// page, so the two never drift apart.
function bulletinArticleHtml(b, opts) {
  opts = opts || {};
  const highlights = b.highlights.map(h => `
    <div class="highlight-card">
      <a class="h-title" href="${h.url}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>
      <div class="h-meta">
        <span>${escapeHtml(h.source)}</span>
        <span class="dot">·</span>
        <span>${WEEKDAY_FMT.format(parseLocalDate(h.published_at))}</span>
        <span class="dot">·</span>
        <span class="sent-chip ${sentDotClass(h.sentiment)}">${sentLabel(h.sentiment)}</span>
      </div>
      ${kwRow(h.keywords)}
    </div>`).join("");

  const analysisHtml = b.analysis.map(a => `<h4>${escapeHtml(a.h)}</h4><p>${escapeHtml(a.p)}</p>`).join("");

  const articleItems = b.articles.map(a => `
    <li>
      <div class="al-top">
        <a class="al-title" href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a>
        <span class="sent-chip ${sentDotClass(a.sentiment)}">${sentLabel(a.sentiment)}</span>
      </div>
      <div class="al-bottom">
        <span class="al-meta">${escapeHtml(a.source)} · ${WEEKDAY_FMT.format(parseLocalDate(a.published_at))}</span>
        ${kwRow(a.keywords)}
      </div>
    </li>`).join("");

  return `
    <article class="bulletin" id="bulletin-${b.id}">
      <div class="eyebrow">${opts.eyebrow || "Boletim semanal"}</div>
      <h1>${escapeHtml(b.title)}</h1>
      <div class="meta-row">
        <span>Semana de ${weekRangeLabel(b)}</span>
        <span>·</span>
        <span>Publicado em ${publishedLabel(b.published_at)}</span>
        <div class="sentiment-row">${sentimentChips(b.sentiments)}</div>
      </div>
      <p class="lead">${escapeHtml(b.summary)}</p>

      <section class="block">
        <h3>Destaques da semana</h3>
        <div class="highlight-grid">${highlights}</div>
      </section>

      <section class="block">
        <h3>Análise e conclusão</h3>
        <div class="analysis-body">${analysisHtml}</div>
      </section>

      <section class="block">
        <h3>Todos os artigos desta semana (${b.articles.length + b.highlights.length})</h3>
        <ul class="article-list">${articleItems}</ul>
      </section>
    </article>`;
}

function renderList() {
  const [latest, ...older] = MOCK_BULLETINS;
  const head = `
    <div class="list-head">
      <h1>Boletins semanais</h1>
      <p>Um resumo, toda semana, do que realmente importou no agronegócio brasileiro — tendências de mercado, riscos climáticos e movimentos das principais empresas do setor.</p>
      <a class="rss-link" href="feed.xml" target="_blank" rel="noopener"><span class="rss-icon">RSS</span> Assine os boletins por RSS</a>
    </div>`;
  const trending = trendingCard(MOCK_BULLETINS);
  const latestHtml = latest ? `
    <div class="latest-eyebrow-row">
      <span class="latest-badge">Edição mais recente</span>
    </div>
    ${bulletinArticleHtml(latest, { eyebrow: "Boletim semanal · edição mais recente" })}` : "";
  const olderHtml = older.length ? `
    <section class="older-bulletins">
      <h3 class="older-head">Boletins anteriores</h3>
      ${older.map(b => `
        <a class="bulletin-card" data-id="${b.id}" href="#/boletim/${b.id}">
          <div class="eyebrow">Semana de ${weekRangeLabel(b)}</div>
          <h2>${escapeHtml(b.title)}</h2>
          <p class="excerpt">${escapeHtml(b.summary)}</p>
          <div class="card-foot">
            <div class="sentiment-row">${sentimentChips(b.sentiments)}</div>
            <span class="read-link">Ler boletim completo →</span>
          </div>
        </a>`).join("")}
    </section>` : "";
  document.getElementById("app").innerHTML = head + trending + latestHtml + olderHtml;
  document.querySelectorAll(".bulletin-card").forEach(card => {
    card.onclick = (e) => { e.preventDefault(); location.hash = `#/boletim/${card.dataset.id}`; };
  });
}

function renderDetail(id) {
  const b = MOCK_BULLETINS.find(x => x.id === Number(id));
  if (!b) { renderList(); return; }
  document.getElementById("app").innerHTML = `
    <button class="back-link" id="back-btn">← Todos os boletins</button>
    ${bulletinArticleHtml(b)}`;
  document.getElementById("back-btn").onclick = () => { location.hash = "#/"; };
  window.scrollTo(0, 0);
}

// Full browsable index of every keyword the system tracks, grouped the
// same way as the "keywords" table's category column. Each term links to
// its own filtered view (renderKeywordDetail).
function renderKeywordsIndex() {
  const regional = MOCK_ALL_KEYWORDS.regional || [];
  const sectionDefs = [
    { label: KEYWORD_CATEGORY_LABELS.cultura, terms: MOCK_ALL_KEYWORDS.cultura },
    { label: KEYWORD_CATEGORY_LABELS.insumo, terms: MOCK_ALL_KEYWORDS.insumo },
    { label: "Regiões", terms: regional.filter(t => MACRO_REGIONS.has(t)) },
    { label: "Estados", terms: regional.filter(t => !MACRO_REGIONS.has(t)) },
    { label: KEYWORD_CATEGORY_LABELS.empresa, terms: MOCK_ALL_KEYWORDS.empresa },
    { label: KEYWORD_CATEGORY_LABELS.geral, terms: MOCK_ALL_KEYWORDS.geral }
  ];
  const sections = sectionDefs.filter(s => (s.terms || []).length).map(s => `
    <div class="kwidx-section">
      <h3>${escapeHtml(s.label)}</h3>
      <div class="kwidx-chips">
        ${s.terms.map(term => `<a class="kwidx-chip" href="${keywordHref(term)}">${escapeHtml(term)}</a>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("app").innerHTML = `
    <button class="back-link" id="back-btn">← Todos os boletins</button>
    <div class="list-head">
      <h1>Palavras-chave</h1>
      <p>Todos os termos que o sistema acompanha — culturas, insumos, regiões, estados e empresas do agronegócio. Clique em qualquer um para ver as notícias relacionadas.</p>
    </div>
    ${sections}`;
  document.getElementById("back-btn").onclick = () => { location.hash = "#/"; };
  window.scrollTo(0, 0);
}

// Filters every highlight/artigo across all published bulletins for an
// exact keyword match, newest bulletin first — a simple stand-in for what
// would be a real query against the articles/keywords tables.
function renderKeywordDetail(term) {
  const matches = [];
  MOCK_BULLETINS.forEach(b => {
    [...b.highlights, ...b.articles].forEach(item => {
      if ((item.keywords || []).some(k => k.toLowerCase() === term.toLowerCase())) {
        matches.push({ item, bulletin: b });
      }
    });
  });

  const resultsHtml = matches.length ? `
    <ul class="article-list">
      ${matches.map(({ item, bulletin }) => `
        <li>
          <div class="al-top">
            <a class="al-title" href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
            <span class="sent-chip ${sentDotClass(item.sentiment)}">${sentLabel(item.sentiment)}</span>
          </div>
          <div class="al-bottom">
            <span class="al-meta">${escapeHtml(item.source)} · ${WEEKDAY_FMT.format(parseLocalDate(item.published_at))}
              · <a class="kwresult-source-link" href="#/boletim/${bulletin.id}">ver no boletim</a></span>
            ${kwRow(item.keywords)}
          </div>
        </li>`).join("")}
    </ul>` : `<p class="empty-state">Nenhuma notícia com a palavra-chave "${escapeHtml(term)}" nos boletins publicados até agora.</p>`;

  document.getElementById("app").innerHTML = `
    <button class="back-link" id="back-btn">← Palavras-chave</button>
    <div class="list-head">
      <div class="eyebrow">Palavra-chave</div>
      <h1>${escapeHtml(term)}</h1>
      <p>${matches.length} notícia${matches.length === 1 ? "" : "s"} encontrada${matches.length === 1 ? "" : "s"} nos boletins publicados.</p>
    </div>
    ${resultsHtml}`;
  document.getElementById("back-btn").onclick = () => { location.hash = "#/palavras-chave"; };
  window.scrollTo(0, 0);
}

function route() {
  const hash = location.hash || "#/";
  let m = hash.match(/^#\/boletim\/(\d+)/);
  if (m) { renderDetail(m[1]); return; }
  m = hash.match(/^#\/palavra-chave\/([^/]+)/);
  if (m) { renderKeywordDetail(decodeURIComponent(m[1])); return; }
  if (/^#\/palavras-chave/.test(hash)) { renderKeywordsIndex(); return; }
  renderList();
}
window.addEventListener("hashchange", route);
document.getElementById("logo-btn").onclick = () => { location.hash = "#/"; };
document.getElementById("nav-boletins").onclick = (e) => { e.preventDefault(); location.hash = "#/"; };
document.getElementById("nav-keywords").onclick = (e) => { e.preventDefault(); location.hash = "#/palavras-chave"; };
document.getElementById("nav-sobre").onclick = (e) => { e.preventDefault(); alert("Página \"Sobre\" ainda não desenhada — só um placeholder nesta prévia."); };
route();
</script>
